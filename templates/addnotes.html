{% extends 'dashboard.html' %}<!--  it will inherit dashboard page -->
{% block title %}<title>Create Note</title>{% endblock %}
{% block addcss %}<link rel="stylesheet" href="{{url_for('static',filename='addnotes.css')}}"/>{% endblock %}



{% block content %}
<div class="Content">
    <div class="note-card">
        <h2 class="note-title">Create New Note</h2>
        <p class="note-subtitle">
            Write down your thoughts and ideas
        </p>
        <form action="/add-note" method="post">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Enter note title" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" placeholder="Write your note here..." required></textarea>
            </div>
            <button type="submit" class="add-button">
                Add Note
            </button>
        </form>
        <a href="/" class="back-link">Back to Home</a>
    </div>
</div>
{% endblock %}
