<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
        }

        .otp-card {
            width: 350px;
            padding: 30px;
            text-align: center;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .otp-title {
            margin-bottom: 10px;
            color: #222;
        }

        .otp-description {
            margin-bottom: 25px;
            color: #777;
            font-size: 14px;
        }

        .otp-label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        .otp-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
        }

        .otp-button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background-color: #111827;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .otp-button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>

<body>
    <div class="otp-card">
         {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
            {{ message }}
            {% endfor %}
        {% endif %}
        {% endwith %}
        <h2 class="otp-title">Verify OTP</h2>
        <p class="otp-description">
            Enter the OTP sent to your email
        </p>
        <form  method="post">
            <label for="otp" class="otp-label">Enter OTP</label>
            <input type="text" id="otp" name="otp" class="otp-input" placeholder="Enter OTP" maxlength="6" required>
            <button type="submit" class="otp-button">
                Verify OTP
            </button>
        </form>
    </div>
</body>

</html>
